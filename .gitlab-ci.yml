image: docker:latest

services:
  - docker:dind  # Enable Docker-in-Docker

stages:
  - test
  - lint
  - format
  - deploy

variables:
  LINT_COMMAND: "flake8 ."
  FORMAT_COMMAND: "black ."
  BUILD_DOCKER_IMAGE_NAME: "ml-api-ml-api"
  TARGET_DOCKER_IMAGE_NAME: "ml-api"
  VERSION: "0.3.0"
  DOCKER_DRIVER: overlay2  # Use overlay2 storage driver for Docker

test:
  stage: test
  image: python:3.12.6-slim
  tags: 
    - ml-api
  script:
    - pip install --upgrade pip
    - pip install poetry  # Install Poetry
    - poetry install --no-root --no-dev  # Install dependencies defined in pyproject.toml
    - export PYTHONPATH=$(pwd)  # Set PYTHONPATH to the project root
    - poetry run pytest -v ./tests/local  # Run pytest in the local tests directory using Poetry
  allow_failure: false
  only:
    - merge_requests

lint:
  stage: lint
  script:
    - pip install flake8
    - $LINT_COMMAND
  allow_failure: true
  only:
    - merge_requests

format:
  stage: format
  script:
    - pip install black
    - $FORMAT_COMMAND --check
  allow_failure: true
  only:
    - merge_requests

format-fix:
  stage: format
  script:
    - pip install black
    - $FORMAT_COMMAND
    - git config --global user.email "project65339238_bot@noreply.gitlab.com"
    - git config --global user.name "CI Bot"
    - git add .
    - git commit -m "Format code with black"
  only:
    - merge_requests
  when: manual

build:
  stage: deploy
  tags: 
    - ml-api
  script:
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin 
    - docker-compose build
    - docker save $BUILD_DOCKER_IMAGE_NAME -o image.tar  # Save the image to a tar file
  artifacts:
    paths:
      - image.tar  # Save the tar file as an artifact
  only:
    - merge_requests # Push to Docker Hub only upon successful merge to master

push:
  stage: deploy
  tags: 
    - ml-api
  script:
      - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin 
      - docker load -i image.tar  # Load the image from the tar file
      - docker tag $BUILD_DOCKER_IMAGE_NAME $TARGET_DOCKER_IMAGE_NAME:$VERSION  # Tag the image with the current version
      - docker tag $TARGET_DOCKER_IMAGE_NAME:$VERSION $TARGET_DOCKER_IMAGE_NAME:latest  # Tag the image as latest
      - docker push $DOCKER_IMAGE_NAME:$VERSION
      - docker push $DOCKER_IMAGE_NAME:latest
  only:
    - merge_requests # Push to Docker Hub only upon successful merge to master
